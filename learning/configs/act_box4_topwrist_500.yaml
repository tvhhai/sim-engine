# Camera trên cao + cổ tay, 500 ván (gấp 2,5 lần), train lâu. Thí nghiệm: gộp hai thứ đã chứng minh có ích
# (camera thấy hộp từ đầu: 36-40%; train nhiều hơn: toạ độ 10-17% -> 39-42%) cộng thêm dữ liệu.
# Chạy trên Colab (T4): batch 32 x 60k bước ~ 22 lượt qua ~87k khung, gần bằng số lượt của bản Colab 200 ván (b32 x 30k ~ 27 lượt).
# Ở nhà (GTX 1650) chạy được nhưng mất cả ngày.

# --- Dữ liệu ---
dataset.repo_id: local/so101_box4_topwrist_500
dataset.root: D:/vla/datasets/so101_box4_topwrist_500
dataset.video_backend: pyav

# --- Mạng: giữ nguyên như act_box4_topwrist.yaml ---
policy.type: act
policy.device: cuda
policy.push_to_hub: false
policy.use_amp: true
policy.chunk_size: 50
policy.n_action_steps: 20
policy.optimizer_lr: 0.00003

# --- Nơi lưu và cách chạy ---
output_dir: D:/vla/outputs/train/act_box4_topwrist_500
job_name: act_box4_topwrist_500
batch_size: 32
steps: 60000
save_freq: 10000
log_freq: 100
num_workers: 2
