# Train TIẾP một checkpoint ACT (dùng cho mỗi vòng DAgger), learning rate GIẢM DẦN.
#   python -m sim_engine.learning.train learning/configs/act_finetune.yaml --policy.path=<checkpoint>/pretrained_model \
#       --dataset.repo_id=local/<dataset gộp> --dataset.root=<thư mục> --output_dir=<thư mục mới>
# Lịch lr: tăng dần 500 step đầu tới 3e-5 rồi giảm mượt (cosine) về 0 ở step cuối. Vòng 1-3 dùng lr cố định 3e-5 và điểm nhảy mạnh giữa
# các checkpoint (vòng 3: 69/73/53/79/73/77 % trên 100 seed); lr giảm dần: ck 2,5k và 5k cùng 591/774.
# Cách đặt: preset của ACT luôn ghi đè scheduler = không có, nên tắt preset và tự khai báo optimizer + scheduler. Tác dụng phụ: preset
# cho ResNet18 lr riêng 1e-5, ở đây cả mạng dùng chung optimizer.lr.
# Không có policy.type: loại mạng và tham số mạng lấy theo checkpoint ở policy.path.

# --- Mạng: nạp từ checkpoint (Colab ghi đè) ---
policy.path: D:/vla/outputs/train/act_box4_topwrist_500_dagger3_colab/checkpoints/020000/pretrained_model
policy.device: cuda
policy.push_to_hub: false

# --- Dữ liệu: dataset gộp (demo + các vòng DAgger), tạo bằng learning/merge_datasets.py (Colab ghi đè) ---
dataset.repo_id: local/so101_box4_topwrist_500_dagger4
dataset.root: D:/vla/datasets/so101_box4_topwrist_500_dagger4
dataset.video_backend: pyav

# --- Tối ưu: như preset ACT (AdamW, lr 3e-5, weight decay 1e-4, cắt gradient 10) + lịch giảm dần ---
use_policy_training_preset: false
optimizer.type: adamw
optimizer.lr: 0.00003
optimizer.weight_decay: 0.0001
optimizer.grad_clip_norm: 10.0
scheduler.type: cosine_annealing_with_warmup
scheduler.num_warmup_steps: 500

# --- Nơi lưu và cách chạy ---
output_dir: D:/vla/outputs/train/act_finetune
job_name: act_finetune
batch_size: 32
steps: 20000
save_freq: 5000
log_freq: 100
num_workers: 4
