# Train lại từ đầu trên dữ liệu CHỈ MỘT THẦY (minimum-jerk, policy mặc định từ commit 94e80ef).
# Vì sao: các mạng DAgger 1-3 học trên dữ liệu lẫn hai thầy: 500 ván gốc ghi bằng ScriptedPolicyHybrid bản gốc (đi nhanh, trung vị
# ~130 bước) + ván DAgger ghi bằng min-jerk (đi chậm, thả thấp, kéo vòng cung). Cùng cảnh mà hai lệnh khác nhau -> ACT học trung bình,
# mạng chập chờn: 3 mạng tốt nhất cùng ~601/774 nhưng chỉ 455 seed đạt ở cả ba.
# Dữ liệu: 500 ván min-jerk mới (seed 3000+, như bản gốc) + DAgger vòng 2-3 (800 ván, thầy min-jerk đã sửa "hộp đã ở bát").
# Bỏ DAgger vòng 1 (thầy chưa sửa, có đoạn cố gắp hộp ra khỏi bát). So với: dagger2 ck 010000 = 602/774 (77,8 %).

# --- Dữ liệu (Colab ghi đè root) ---
dataset.repo_id: local/so101_box4_topwrist_mj
dataset.root: D:/vla/datasets/so101_box4_topwrist_mj
dataset.video_backend: pyav

# --- Mạng: giữ nguyên như act_box4_topwrist_500.yaml ---
policy.type: act
policy.device: cuda
policy.push_to_hub: false
policy.use_amp: true
policy.chunk_size: 50
policy.n_action_steps: 20
policy.optimizer_lr: 0.00003

# --- Nơi lưu và cách chạy ---
output_dir: D:/vla/outputs/train/act_box4_topwrist_mj
job_name: act_box4_topwrist_mj
batch_size: 32
steps: 60000
save_freq: 10000
log_freq: 100
num_workers: 4
