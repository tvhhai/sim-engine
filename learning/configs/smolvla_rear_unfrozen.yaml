# Fine-tune SmolVLA trên dataset camera MỚI (rear sát sau đế tay + cổ tay), MỞ KHOÁ phần nhìn.
#   python -m sim_engine.learning.train learning/configs/smolvla_rear_unfrozen.yaml --dataset.repo_id=... --dataset.root=...
# Vì sao mở khoá (sổ tay mục 17): SmolVLA khoá phần nhìn (smolvla_finetune.yaml) chững ở 61 % / 100 seed; đo offline thấy nó bám vị trí
# hộp yếu hơn ACT ~20 %, xoay cổ tay và canh lúc khép kẹp kém gấp 1,5-2 lần, còn đoạn kẹp / mang thì ngang ACT -> chỗ nghẽn là phần
# nhìn SigLIP học trên ảnh internet, không được dạy "hộp đỏ 4 cm nằm ở đâu" trong ảnh sim.
# Hai cờ PHẢI tắt cùng nhau: freeze_vision_encoder=false chỉ mở SigLIP, nhưng train_expert_only=true (mặc định) lại khoá cả VLM
# (gồm SigLIP) trong set_requires_grad của LeRobot. Tắt cả hai = train cả VLM + action expert (~450M tham số).

# --- Mạng: bản học sẵn trên Hugging Face ---
policy.path: lerobot/smolvla_base
policy.device: cuda
policy.push_to_hub: false
policy.freeze_vision_encoder: false
policy.train_expert_only: false
policy.optimizer_lr: 0.00005                   # nửa lr mặc định: train cả VLM, lr lớn dễ phá phần học sẵn
policy.scheduler_decay_steps: 30000            # lịch cosine giảm hết trong 30k step

# smolvla_base đòi camera1/2/3: rear -> camera1, wrist -> camera2 (camera3 mạng tự bù ảnh trống). eval / DAgger đọc lại bảng này từ
# checkpoint (eval_policy.rename_map_of) nên camera1 được dựng từ rearcam.
rename_map: '{"observation.images.rear": "observation.images.camera1", "observation.images.wrist": "observation.images.camera2"}'

# --- Dữ liệu (Colab ghi đè): dataset rear + cổ tay (đã bỏ camera top) ---
dataset.repo_id: local/so101_box4_rearwrist
dataset.root: D:/vla/datasets/so101_box4_rearwrist
dataset.video_backend: pyav

# --- Nơi lưu và cách chạy ---
output_dir: D:/vla/outputs/train/smolvla_rear_unfrozen
job_name: smolvla_rear_unfrozen
batch_size: 32                                 # A100 40 GB; hết bộ nhớ thì 16
steps: 30000
save_freq: 5000                                # chấm nhanh từ 5k: cổng dừng sớm nếu không hơn ACT cùng dữ liệu
log_freq: 100
num_workers: 8
