# Thí nghiệm đầu tiên: ACT bản nhỏ, hộp 4 cm, 200 ván thành công của policy viết tay (seed 3000+).
# Chạy: python -m sim_engine.learning.train learning/configs/act_box4_v1.yaml
# Mỗi khoá dưới đây thành một tham số --khoá=giá_trị của lerobot-train.
#
# Kết quả (2026-11-24): loss 17 -> 0,081 sau 20.000 bước (~2 giờ trên GTX 1650).
#   Seed đánh giá: 26/100 và 19/100 ở hai lần chạy (GPU lệch nhẹ mỗi lần) -> khoảng 20-25 %.
#   Ngay cả 20 seed đã có trong dữ liệu train: chỉ 4/20 -> lỗi chính KHÔNG phải do seed mới lạ.
#   Ảnh ở đầu ván: camera cổ tay không thấy hộp, camera trước thấy hộp chỉ ~6x6 điểm ảnh.
#
# Muốn thử thí nghiệm khác: COPY file này thành act_box4_v2.yaml, đổi job_name / output_dir và tham số cần thử,
# ghi lý do ở đầu file. Giữ nguyên file cũ để so sánh.

# --- Dữ liệu ---
dataset.repo_id: local/so101_box4_v1           # tên dataset (khớp --repo-id lúc ghi)
dataset.root: D:/vla/datasets/so101_box4_v1    # thư mục dataset (khớp --root lúc ghi)
dataset.video_backend: pyav                    # torchcodec trên Windows chưa giải mã được video, dùng pyav

# --- Mạng ---
policy.type: act                               # Action Chunking Transformer: ResNet18 đọc ảnh + transformer đoán chuỗi action
policy.device: cuda                            # train trên GPU
policy.push_to_hub: false                      # không đẩy mô hình lên Hugging Face
policy.use_amp: true                           # tính nửa độ chính xác: nhanh hơn, vừa GPU 4 GB
policy.chunk_size: 50                          # mỗi lần đoán 50 action tới (~1,7 s)
policy.n_action_steps: 20                      # chỉ làm 20 action đầu rồi đoán lại, để phản ứng kịp khi hộp lệch
policy.optimizer_lr: 0.00003                   # tốc độ học: lớn quá thì loss nhảy lung tung, nhỏ quá thì học chậm

# --- Nơi lưu và cách chạy ---
output_dir: D:/vla/outputs/train/act_box4_v1   # checkpoint lưu ở <output_dir>/checkpoints/<bước>/pretrained_model
job_name: act_box4_v1
batch_size: 8                                  # số khung hình mỗi bước học; lớn hơn ổn định hơn nhưng tốn GPU
steps: 20000                                   # số bước học (~4,6 lượt qua toàn bộ 34.823 khung)
save_freq: 5000                                # cứ 5000 bước lưu một checkpoint
log_freq: 100                                  # cứ 100 bước in loss một lần
num_workers: 2                                 # số tiến trình đọc / giải mã video song song
