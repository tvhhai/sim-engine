[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-engine"
version = "1.0.0"
description = "MuJoCo-based SO-101 robot arm simulator for learning manipulation policies"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mujoco>=4.0.1",
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "opencv-python>=4.8.0",
    "h5py>=3.9.0",
]

[project.optional-dependencies]
dev = ["diffusers", "transformers", "torchvision"]

# The repo root *is* the `sim_engine` package (flat layout), so map the package
# name onto the root directory instead of searching for a sim_engine/ subfolder.
[tool.setuptools]
package-dir = {"sim_engine" = "."}
packages = ["sim_engine", "sim_engine.policies", "sim_engine.tools", "sim_engine.studio", "sim_engine.workflows", "sim_engine.ui"]

[tool.setuptools.package-data]
sim_engine = ["assets/*.xml", "assets/so101/*.stl", "results/*.json", "static/replay/*", "static/studio/*.html", "static/studio/assets/*", "docs/*.md", "docs/image/*"]
